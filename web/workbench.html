<!doctype html>
<html lang="zh-CN" class="workbench-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XSS漏洞自动化挖掘工具 Workbench</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./config.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  </head>
  <body class="workbench-body">
    <div id="app"></div>
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        const routeToken = (params.get('auth_token') || '').trim()
        if (routeToken) {
          localStorage.setItem('authToken', routeToken)
          params.delete('auth_token')
          const query = params.toString()
          const nextUrl = query ? `${window.location.pathname}?${query}` : window.location.pathname
          window.history.replaceState({}, '', nextUrl)
        }
        const token = routeToken || localStorage.getItem('authToken') || ''
        if (!token) {
          window.location.href = '/'
          return
        }
        const rawFetch = window.fetch.bind(window)
        window.fetch = (input, init = {}) => {
          const headers = new Headers(init.headers || {})
          headers.set('Authorization', `Bearer ${token}`)
          return rawFetch(input, { ...init, headers }).then(response => {
            if (response.status === 401) {
              localStorage.removeItem('authToken')
              window.location.href = '/'
            }
            return response
          })
        }
      })()
    </script>
    <script type="module" src="./workbench-app.js"></script>
  </body>
</html>
